<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"> <!-- Pozivanje CSS datoteke -->
</head>
<body style="background-image: url('./resursi/Pozadina.jpg'); background-size: cover; background-position: center center; background-repeat: no-repeat; background-attachment: fixed;">
  <header>
    <!-- Video embed -->
    <div class="video-container">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/c72RuHaOBTQ?autoplay=1&mute=1&loop=1&playlist=c72RuHaOBTQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <p class="tagline" data-en="Retro FPS. RayTracing. Vogons. And a total lack of tea." data-hr="Retro FPS. RayTracing. Vogoni. I apsolutni nedostatak čaja.">
      Retro FPS. RayTracing. Vogoni. I apsolutni nedostatak čaja.
    </p>
  </header>

  <div class="buttons">
    <a href="info.html">
      <button data-en="More Info" data-hr="Više Informacija">Više Informacija</button>
    </a>
    <a href="about.html">
      <button data-en="About Us" data-hr="O nama">O nama</button>
    </a>
    <button onclick="window.open('https://youtu.be/c72RuHaOBTQ', '_blank')" data-en="Watch Trailer" data-hr="Pogledaj Trailer">Pogledaj Trailer</button>

  </div>

  <footer>
    &copy; 2025 GlitchCore Studios
  </footer>

  <button class="language-toggle" onclick="toggleLanguage()">EN / HR</button> <!-- Gumb za promjenu jezika -->

  <script>
    let currentLang = 'hr';

    function toggleLanguage() {
      currentLang = currentLang === 'hr' ? 'en' : 'hr';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${currentLang}`);
      });
    }
  </script>
</body>
